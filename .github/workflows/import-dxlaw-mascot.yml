name: Add original DX Law mascot art
on:
  push:
    paths:
      - .github/workflows/import-dxlaw-mascot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-mascot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original uploaded JPEG without any edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/90984b02-78e1-49bc-a8e6-a2291841a5ea.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGE3MjI2ZTE3NThhOGZkYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDg3MjU0NX0.4qBc6lHGO78Shog4cwihBMw0WJKLWw4AttoSs967O4g' \
            --output public/assets/dxlaw-mascot-original.jpeg
          echo 'c54db2e1af2ca717b71fe228a0ebddf3fea8e105a981c8fe8ae09307cffb1603  public/assets/dxlaw-mascot-original.jpeg' | sha256sum --check
      - name: Commit source image unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/dxlaw-mascot-original.jpeg
          if ! git diff --cached --quiet; then
            git commit -m "Add original, unmodified mascot artwork asset"
            git push
          fi
