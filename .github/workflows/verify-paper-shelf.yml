name: Verify DX Law Notion paper bookshelf
on:
  push:
    paths:
      - .github/workflows/verify-paper-shelf.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production papers endpoint returns strict Notion paper data
        run: |
          set -euo pipefail
          url='https://dxlaw.aries-llcinfo.workers.dev/api/papers'
          for i in 1 2 3 4 5; do
            status=$(curl -L --silent --show-error --output /tmp/papers.json --write-out '%{http_code}' --max-time 20 "$url" || true)
            echo "Papers endpoint HTTP status: $status"
            if [ "$status" = 200 ]; then break; fi
            sleep 10
          done
          test "$status" = 200
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/papers.json','utf8'));
          if(d.source!=='notion-paper-repository'||!Array.isArray(d.works))throw Error('Unexpected source');
          if(d.works.some(w=>w.type!=='論文'))throw Error('Non-paper entry returned');
          if(d.works.some(w=>!Array.isArray(w.specialties)||typeof w.subfield!=='string'))throw Error('Notion subject information missing');
          console.log('Verified live Notion paper count:',d.works.length);
          console.log('Includes at least one paper:',d.works.length>0);
          NODE
      - name: Verify the public page contains the new bookshelf
        run: |
          set -euo pipefail
          # GitHub push can finish before the Cloudflare deployment; wait for the grouped-page marker.
          for i in $(seq 1 18); do
            curl -fsSL --max-time 20 https://dxlaw.aries-llcinfo.workers.dev/ -o /tmp/dxlaw-home.html
            if grep -q 'id="paper-sort"' /tmp/dxlaw-home.html; then break; fi
            echo "New grouping deployment not yet visible (attempt $i)"
            sleep 5
          done
          grep -q 'id="paper-sort"' /tmp/dxlaw-home.html
          grep -q 'PAPERS_API_URL' /tmp/dxlaw-home.html
          grep -q '論文リポジトリ</h2>' /tmp/dxlaw-home.html
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/dxlaw-home.html','utf8');
          for(const v of ['id="paper-sort"','id="works-grid" class="bookshelf"','cover-admin','cover-finance','cover-medical','cover-literature','const PAPER_FAMILY_RULES = [','function sortedPapers()']) {
            if (!h.includes(v)) throw Error('Missing color marker: '+v);
          }
          const start=h.indexOf('const PAPER_FAMILY_RULES = [');
          const end=h.indexOf('    function renderWorks()',start);
          if(start<0||end<0)throw Error('Color mapping function not found');
          const resolve=Function(h.slice(start,end)+';return paperColorFamily;')();
          const cases=[
            [{field:'法学',subfield:'法学',specialties:['行政法','補助金法']},'admin'],
            [{field:'法学',subfield:'法学',specialties:['有価証券法','民法']},'finance'],
            [{field:'法学',subfield:'医事法',specialties:['医事法']},'medical'],
            [{field:'法学',subfield:'法学',specialties:['法情報学','AIガバナンス']},'info'],
            [{field:'経営学',subfield:'経営学',specialties:['金融機関経営']},'economy'],
            [{field:'文学',subfield:'文学',specialties:['比較文学']},'literature'],
            [{field:'法学',subfield:'不動産法',specialties:['不動産法','比較法史']},'civil'],
            [{field:'法学',subfield:'法学',specialties:[]},'other']
          ];
          for(const [input,expected] of cases) {
            const actual=resolve(input).key;
            if(actual!==expected)throw Error('Expected '+expected+' got '+actual+' for '+JSON.stringify(input));
          }
          console.log('Verified Notion-based subject color mappings:',cases.length);
          // Use a minimal DOM to exercise the production sorting code itself.
          const renderEnd=h.indexOf('    function openWorkModal(',start);
          if(renderEnd<0)throw Error('Continuous bookshelf renderer missing');
          const src=h.slice(start,renderEnd);
          const makeEl=tag=>({
            tag,children:[],attrs:{},className:'',textContent:'',
            setAttribute(k,v){this.attrs[k]=v;},
            append(...parts){this.children.push(...parts);},
            replaceChildren(...parts){this.children=[...parts];}
          });
          const root=makeEl('div');
          const doc={getElementById:id=>id==='works-grid'?root:null,createElement:makeEl};
          const fakePapers=[
            {paperId:'PAP-0020',title:'金融B',type:'論文',specialties:['金融法'],field:'法学',url:'https://www.notion.so/1'},
            {paperId:'PAP-0002',title:'行政B',type:'論文',specialties:['行政法'],field:'法学',url:'https://www.notion.so/2'},
            {paperId:'PAP-0021',title:'行政A',type:'論文',specialties:['補助金法'],field:'法学',url:'https://www.notion.so/3'},
            {paperId:'PAP-0001',title:'金融A',type:'論文',specialties:['有価証券法'],field:'法学',url:'https://www.notion.so/4'}
          ];
          const app=Function('worksData','document','paperSyncError',src+';return {renderWorks,setPaperSort,sortedPapers};')(fakePapers,doc,false);
          const colors=()=>root.children.map(slot=>slot.children[0].className);
          const ids=()=>root.children.map(slot=>slot.children[0].children[0].textContent);
          if(root.children.length!==0)throw Error('Should not populate shelf before render');
          app.renderWorks();
          if(root.children.length!==4)throw Error('Expected four books in ONE shelf');
          if(colors().join(',')!=='shelf-book cover-admin,shelf-book cover-admin,shelf-book cover-finance,shelf-book cover-finance')
            throw Error('Default sort did not cluster same-colour books');
          if(root.children[2].attrs['data-group-start']!=='true')throw Error('Missing subtle group boundary');
          app.setPaperSort('id');
          if(ids().join(',')!=='PAP-0001,PAP-0002,PAP-0020,PAP-0021')
            throw Error('ID sort incorrect: '+ids());
          if(root.children.some(slot=>slot.attrs['data-group-start']))throw Error('Boundary should be hidden in ID sort');
          app.setPaperSort('title');
          if(ids().join(',')!=='PAP-0001,PAP-0020,PAP-0021,PAP-0002')
            throw Error('Title sort incorrect: '+ids());
          app.setPaperSort('color');
          if(colors().join(',')!=='shelf-book cover-admin,shelf-book cover-admin,shelf-book cover-finance,shelf-book cover-finance')
            throw Error('Color sort not restored');
          console.log('Verified single shelf, grouping and interactive sorting');
          NODE
