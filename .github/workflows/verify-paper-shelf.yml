name: Verify DX Law multi-page website and Notion paper bookshelf
on:
  push:
    paths:
      - public/**
      - .github/workflows/verify-paper-shelf.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent pages, shared assets, and six-book mobile shelf
        run: |
          node <<'NODE'
          const fs = require('fs');
          const load = p => fs.readFileSync(p, 'utf8');
          const home = load('public/index.html');
          const repo = load('public/repository/index.html');
          const profile = load('public/kazuki-ando/index.html');
          const css = load('public/assets/site.css');
          const js = load('public/assets/site.js');
          for (const [name, page] of [['home', home], ['repository', repo], ['profile', profile]]) {
            if (!page.includes('href="/assets/site.css"') || !page.includes('src="/assets/site.js"')) throw Error(name + ': missing shared assets');
            if (!page.includes('href="/repository/#works"') || !page.includes('href="/kazuki-ando/#profile"')) throw Error(name + ': missing cross-page navigation');
          }
          if (!home.includes('href="/repository/"') || !home.includes('href="/kazuki-ando/"')) throw Error('Home links not found');
          if (home.includes('id="works-grid"') || home.includes('id="profile-name"')) throw Error('Home still contains the dedicated sections');
          if (!home.includes('id="news-list"') || !home.includes('id="framework"')) throw Error('Home content missing');
          if (!repo.includes('id="works-grid"') || !repo.includes('id="paper-sort"')) throw Error('Repository shelf or sorting missing');
          if (repo.includes('id="profile-name"')) throw Error('Repository contains the profile section');
          if (!profile.includes('id="profile-name"') || !profile.includes('id="profile-themes"')) throw Error('Researcher profile missing');
          if (profile.includes('id="works-grid"')) throw Error('Profile contains the repository shelf');
          if (!js.includes("const PAPERS_API_URL = '/api/papers'") || !js.includes("w.type !== '論文'")) throw Error('Notion papers filtering missing');
          if (!js.includes('function paperColorFamily(work)') || !js.includes('function sortedPapers()')) throw Error('Repository sorting/color logic missing');
          if (!css.includes('flex:0 0 calc(100% / 6); width:calc(100% / 6);')) throw Error('Six-across responsive slots missing');
          if (!css.includes('#works-grid.bookshelf { display:flex; flex-wrap:wrap; gap:0; overflow-x:hidden;')) throw Error('Mobile shelf wrapping missing');
          for (const viewport of [320, 360, 375, 390, 414, 430, 480]) {
            const usable = viewport - 32 - 12;
            const spine = usable / 6;
            if (spine <= 0 || Math.abs(spine * 6 - usable) > 1e-8) throw Error('Six slots do not fit ' + viewport);
          }
          new Function(js);
          console.log('PASS: homepage, repository, researcher profile, six-book mobile shelf, and valid JavaScript.');
          NODE
