<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="DX法研究会の統合研究プログラム「法情報学・計算法制度科学」。法制度の権限・確定・訂正・損失帰属を形式化し、企業・行政の行動と経営・経済への影響を検証する研究計画。">
<title>法情報学・計算法制度科学｜統合研究プログラム | DX法研究会</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root {--navy:#14213D;--deep:#0B1323;--gold:#9A7B3E;--line:#E2DDD5;--paper:#FBF9F5;--stone:#F2EFE9}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#263044;background:var(--paper);line-height:1.9}
  a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .serif{font-family:"Noto Serif JP",YuMincho,"Hiragino Mincho ProN",serif}
  .en{font-family:Georgia,serif;letter-spacing:.08em}
  .wrap{width:min(1080px,calc(100% - 40px));margin-inline:auto}
  .site-header{position:sticky;top:0;z-index:30;background:#FBF9F5ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:86px}
  .brand{text-decoration:none;display:flex;align-items:center;gap:12px}.brand-mark{width:43px;height:43px;display:grid;place-items:center;background:var(--navy);color:#c5a880;font-size:24px;line-height:1}.brand-main{display:block;color:var(--navy);font-size:20px;font-weight:700;letter-spacing:.08em}.brand-sub{font-size:11px;color:#647083;line-height:1.4}
  .nav{display:flex;align-items:center;gap:23px;font-size:13px}.nav a{text-decoration:none;border-bottom:2px solid transparent;padding:9px 0}.nav a:hover,.nav a[aria-current="page"]{color:var(--navy);border-color:var(--gold)}
  .menu-toggle{display:none;border:1px solid var(--line);background:white;padding:9px 13px;font-size:13px;color:var(--navy)}
  .hero{padding:74px 0 56px;border-bottom:1px solid var(--line)}.eyebrow{display:block;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.2em}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.48;color:var(--navy);letter-spacing:.025em;font-weight:600;margin:20px 0 12px}.hero .sub{font-size:18px;font-family:Georgia,serif;color:#637081;margin:0 0 25px;line-height:1.5}.lead{font-size:17px;max-width:820px;line-height:2.2;color:#394255}
  .status{margin-top:28px;padding:13px 18px;display:inline-block;border:1px solid #d8cbb7;color:#665b4c;background:#f7f1e6;font-size:13px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:var(--navy);color:white;padding:12px 22px;font-size:14px;border:1px solid var(--navy)}.button.secondary{background:white;color:var(--navy);border-color:var(--line)}.button:hover{filter:brightness(.93)}
  section.content-section{padding:62px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 27px}.section-head .section-num{font-family:Georgia,serif;font-size:15px;color:var(--gold)}h2{font-size:clamp(23px,3.2vw,31px);margin:0;color:var(--navy);font-weight:600;line-height:1.5}h3{font-size:18px;color:var(--navy);font-weight:600;margin:0 0 10px}
  p{margin:0 0 18px}.muted{color:#637081}.wide{max-width:900px}.quote{border-left:3px solid var(--gold);padding:14px 0 14px 25px;margin:26px 0;background:linear-gradient(90deg,#f2efe9,transparent);font-size:20px;line-height:1.85;color:var(--navy)}
  .layers{display:grid;gap:9px;max-width:900px}.layer{display:grid;grid-template-columns:60px 190px 1fr;gap:18px;align-items:center;padding:17px 22px;border:1px solid var(--line);background:white}.layer .number{font-family:Georgia,serif;font-size:27px;color:var(--gold)}.layer strong{color:var(--navy);font-size:16px}.layer span:last-child{font-size:14px;color:#556070}
  .card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);padding:25px}.card .micro{font-family:Georgia,serif;letter-spacing:.1em;color:var(--gold);font-size:13px}.card p{font-size:14px;color:#566071;margin-bottom:0}.card ul{padding-left:20px;font-size:14px;color:#566071}
  .objective-definition{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);padding:27px 30px;margin:0 0 25px}.objective-label{font:700 12px Georgia,serif;color:var(--gold);letter-spacing:.14em;display:block;margin-bottom:15px}.objective-text{font-size:clamp(18px,2.6vw,24px);font-weight:600;color:var(--navy);line-height:1.9;margin-bottom:12px}.objective-en{font-size:13px;color:#718093;margin-bottom:0}.objective-explain{font-size:15px;color:#475569;line-height:2.05}.objective-explain strong{color:var(--navy)}
  .math{background:var(--deep);color:#e3e6e8;padding:21px 26px;border-left:3px solid #c5a880;overflow-wrap:anywhere;font-size:16px;letter-spacing:.02em;font-family:Georgia,"Noto Serif JP",serif;margin:22px 0}.math small{font-size:12px;color:#b6c0cc;display:block;margin-top:9px;font-family:sans-serif}
  .time-table{border-collapse:collapse;width:100%;background:white;font-size:14px}.time-table th,.time-table td{padding:16px 19px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.time-table th{background:var(--navy);color:white;font-weight:500}.time-table td:first-child{white-space:nowrap;color:var(--navy);font-weight:600}.time-table tr:last-child td{border-bottom:0}.table-scroll{overflow-x:auto;border:1px solid var(--line)}
  .smallprint{font-size:13px;color:#6c7580}.source-links{padding-left:22px}.source-links li{margin-bottom:12px}.source-links a{color:#1f4670;text-underline-offset:3px}
  footer{background:var(--deep);color:#e5e7eb;padding:36px 0;font-size:13px}footer a{color:#e5e7eb;text-underline-offset:3px}.footer-inner{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
  @media(max-width:800px){.header-inner{min-height:73px}.menu-toggle{display:block}.nav{display:none;position:absolute;left:0;right:0;top:100%;background:#FBF9F5;border-bottom:1px solid var(--line);padding:18px 22px;flex-direction:column;align-items:stretch;gap:7px}.nav.open{display:flex}.nav a{padding:10px 3px}.card-grid{grid-template-columns:1fr}.layer{grid-template-columns:45px 1fr;gap:8px 13px}.layer span:last-child{grid-column:2}.hero{padding:43px 0}.hero h1{font-size:31px}.lead{font-size:15px}.quote{font-size:17px}.time-table{min-width:620px}section.content-section{padding:44px 0}.brand-main{font-size:17px}}

  /* Notion is the single content source; these rules only present its blocks. */
  .notion-content{max-width:920px;overflow-wrap:anywhere}
  .notion-content h2{margin:45px 0 19px;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:clamp(22px,3vw,30px);line-height:1.55}
  .notion-content h3{margin:34px 0 13px;font-size:19px;line-height:1.55}
  .notion-content h4{margin:26px 0 12px;color:var(--navy);font-size:16px}
  .notion-content p{font-size:15px;line-height:2.1;margin:0 0 19px;white-space:pre-line}
  .notion-content ul,.notion-content ol{margin:0 0 21px;padding-left:1.55em}
  .notion-content li{font-size:15px;line-height:2;margin:8px 0;white-space:pre-line}
  .notion-content li ul,.notion-content li ol{margin:6px 0 8px}
  .notion-content a{color:#205b8f;text-underline-offset:3px;overflow-wrap:anywhere}
  .notion-content blockquote,.notion-content aside{margin:22px 0;padding:16px 22px;border-left:3px solid var(--gold);background:var(--stone);font-size:15px;line-height:2}
  .notion-content code{font-size:.93em;background:#ece9e3;padding:2px 5px}
  .notion-content pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px 20px;border:1px solid var(--line);background:white;margin:18px 0 25px;font-size:14px}
  .notion-content .notion-equation{font-family:Georgia,serif;background:#f1eee8}
  .notion-content .notion-table-scroll{overflow-x:auto;margin:21px 0 30px;border:1px solid var(--line)}
  .notion-content table{border-collapse:collapse;min-width:550px;width:100%;background:white;font-size:14px}
  .notion-content th,.notion-content td{padding:13px 15px;border:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.8}
  .notion-content th{background:#eae6dd;color:var(--navy)}
  .notion-content hr{border:0;border-top:1px solid var(--line);margin:30px 0}
  .notion-content .notion-child-link{display:block;margin:15px 0;padding:12px 16px;border:1px solid var(--line);background:white}
  #programme-notion-status{color:#627083;padding:14px 0;font-size:14px}
  #programme-notion-status[hidden]{display:none}
  @media(max-width:700px){.notion-content h2{margin-top:33px}.notion-content th,.notion-content td{padding:10px}.hero h1{font-size:31px}}
</style>
</head>
<body>
<header class="site-header">
<div class="wrap header-inner">
 <a href="/" class="brand" aria-label="DX法研究会トップ"><span class="brand-mark" aria-hidden="true">◇</span><span><span class="brand-main serif">DX法研究会</span><span class="brand-sub en">Research Group on DX Law &amp; Legal Informatics</span></span></a>
 <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="site-nav" aria-expanded="false">メニュー ☰</button>
 <nav class="nav" id="site-nav" aria-label="主要ナビゲーション">
  <a href="/#news">新着情報</a><a href="/repository/#works">論文リポジトリ</a><a href="/research-program/" aria-current="page">研究プログラム</a><a href="/kazuki-ando/#profile">安藤和樹</a>
 </nav>
</div>
</header>
<main id="top">
 <section class="hero"><div class="wrap">
  <span class="eyebrow en">Research Programme / Legal Informatics</span>
  <h1 class="serif">法情報学・計算法制度科学</h1>
  <p class="sub">Computational Science of Legal Institutions</p>
  <p class="lead" id="programme-title">統合研究プログラム</p>
  <p class="smallprint" id="programme-updated" aria-live="polite">研究計画をNotionから取得しています。</p>
 </div></section>
 <section class="content-section" id="programme"><div class="wrap wide">
  <div id="programme-notion-status" role="status" aria-live="polite">Notionの研究計画を読み込み中です。</div>
  <article id="programme-notion-content" class="notion-content" aria-label="Notionから取得した研究プログラム"></article>
 </div></section>
</main>
<footer><div class="wrap footer-inner"><div><strong class="serif">DX法研究会</strong><div class="en">Research on Law &amp; Legal Informatics</div></div><div><a href="/">トップ</a>　<a href="/repository/">論文リポジトリ</a>　<a href="/kazuki-ando/">研究者プロフィール</a></div></div></footer>
<script>

function legalProgrammeUrl(value) {
  try {
    const url = new URL(value);
    return ['https:', 'http:', 'mailto:'].includes(url.protocol) ? url.href : null;
  } catch (_) {
    return null;
  }
}
function addNotionText(container, pieces) {
  for (const piece of Array.isArray(pieces) ? pieces : []) {
    let node = document.createTextNode(String(piece.text || '').replace(/<br\s*\/?>/gi, '\n'));
    for (const [active, tag] of [
      [piece.code, 'code'],
      [piece.strikethrough, 's'],
      [piece.underline, 'u'],
      [piece.italic, 'em'],
      [piece.bold, 'strong'],
    ]) {
      if (active) {
        const wrapper = document.createElement(tag);
        wrapper.appendChild(node);
        node = wrapper;
      }
    }
    const link = legalProgrammeUrl(piece.href);
    if (link) {
      const anchor = document.createElement('a');
      anchor.href = link;
      anchor.rel = 'noopener noreferrer';
      if (link.startsWith('https:') || link.startsWith('http:')) anchor.target = '_blank';
      anchor.appendChild(node);
      node = anchor;
    }
    container.appendChild(node);
  }
}
function renderNotionProgrammeBlock(block, container) {
  const type = block.type;
  if (type === 'table') {
    const scroller = document.createElement('div');
    scroller.className = 'notion-table-scroll';
    const table = document.createElement('table');
    for (const [index, row] of (block.children || []).entries()) {
      if (row.type !== 'table_row') continue;
      const tr = document.createElement('tr');
      for (const cell of row.cells || []) {
        const th = document.createElement(block.hasColumnHeader && index === 0 ? 'th' : 'td');
        if (th.tagName === 'TH') th.scope = 'col';
        addNotionText(th, cell);
        tr.appendChild(th);
      }
      table.appendChild(tr);
    }
    scroller.appendChild(table);
    container.appendChild(scroller);
    return;
  }
  if (type === 'bulleted_list_item' || type === 'numbered_list_item') {
    const tag = type === 'bulleted_list_item' ? 'ul' : 'ol';
    let list = container.lastElementChild;
    if (!list || list.tagName.toLowerCase() !== tag || list.dataset.notionList !== type) {
      list = document.createElement(tag);
      list.dataset.notionList = type;
      container.appendChild(list);
    }
    const li = document.createElement('li');
    addNotionText(li, block.richText);
    list.appendChild(li);
    for (const child of block.children || []) renderNotionProgrammeBlock(child, li);
    return;
  }
  if (type === 'divider') {
    container.appendChild(document.createElement('hr'));
    return;
  }
  if (type === 'child_page' || type === 'bookmark') {
    const a = document.createElement('a');
    const href = legalProgrammeUrl(block.url);
    if (!href) return;
    a.href = href;
    a.rel = 'noopener noreferrer';
    a.target = '_blank';
    a.className = 'notion-child-link';
    a.textContent = block.title || block.url;
    container.appendChild(a);
    return;
  }
  if (type === 'equation' || type === 'code') {
    const pre = document.createElement('pre');
    if (type === 'equation') {
      pre.className = 'notion-equation';
      pre.textContent = block.expression || '';
    } else {
      const code = document.createElement('code');
      addNotionText(code, block.richText);
      pre.appendChild(code);
    }
    container.appendChild(pre);
    return;
  }
  const tags = {
    heading_1: 'h2', heading_2: 'h2', heading_3: 'h3',
    paragraph: 'p', quote: 'blockquote', callout: 'aside', to_do: 'p',
  };
  const tag = tags[type];
  if (!tag) return;
  const el = document.createElement(tag);
  if (type === 'to_do') {
    const marker = document.createElement('span');
    marker.textContent = block.checked ? '☑ ' : '☐ ';
    el.appendChild(marker);
  }
  addNotionText(el, block.richText);
  container.appendChild(el);
  for (const child of block.children || []) renderNotionProgrammeBlock(child, el);
}
async function loadNotionProgramme() {
  const status = document.getElementById('programme-notion-status');
  const content = document.getElementById('programme-notion-content');
  try {
    const response = await fetch('/api/research-program', {headers:{Accept:'application/json'}});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (data.source !== 'notion-research-programme' || !Array.isArray(data.blocks) || !data.blocks.length) {
      throw new Error('Invalid Notion programme response');
    }
    document.getElementById('programme-title').textContent = data.title || '統合研究プログラム';
    const updated = document.getElementById('programme-updated');
    const stamp = data.updatedAt ? new Date(data.updatedAt) : null;
    updated.textContent = stamp && !Number.isNaN(stamp.valueOf())
      ? '出典：Notion統合研究計画　最終更新：' + stamp.toLocaleDateString('ja-JP', {timeZone:'Asia/Tokyo'})
      : '出典：Notion統合研究計画';
    const fragment = document.createDocumentFragment();
    for (const block of data.blocks) renderNotionProgrammeBlock(block, fragment);
    content.replaceChildren(fragment);
    status.hidden = true;
  } catch (error) {
    console.warn('Notion programme unavailable:', error);
    status.textContent = 'Notionの研究計画を取得できません。公開内容は一時的に表示できません。';
    document.getElementById('programme-updated').textContent = 'Notionとの同期を確認してください。';
  }
}
loadNotionProgramme();

const trigger=document.getElementById('menu-toggle');
const nav=document.getElementById('site-nav');
trigger.addEventListener('click',()=>{const opened=nav.classList.toggle('open');trigger.setAttribute('aria-expanded',String(opened));});
nav.addEventListener('click',event=>{if(event.target.closest('a')){nav.classList.remove('open');trigger.setAttribute('aria-expanded','false');}});
</script>
</body>
</html>
